bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.2
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]
    odom_topic: /odom
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      
      # === 速度限制 ===
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.2
      max_vel_y: 0.0
      max_vel_theta: 6.0
      
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.01
      
      # === 【关键修改1：解决过冲与滞后】 ===
      # 提高直行加速度，匹配强大的旋转能力，防止运动脱节
      acc_lim_x: 1.0        # 原 0.4 -> 改为 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 5.0
      
      # 大幅增强刹车能力，防止过冲
      decel_lim_x: -2.5    # 原 -1.0 -> 改为 -2.5 (急刹车)
      decel_lim_y: 0.0
      decel_lim_theta: -5.0
      
      # === 采样与预判 ===
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 40
      
      # 缩短预判时间，让反应更灵敏
      sim_time: 1.5         # 原 2.0 -> 改为 1.5
      
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      
      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist",
        ]
      BaseObstacle.scale: 0.02
      
      # === 【关键修改2：解决转向不足】 ===
      # PathAlign: 保持车头朝向路径方向
      PathAlign.scale: 38.0
      PathAlign.forward_point_distance: 0.1
      
      # PathDist: 【核心】强迫车身贴合路径线。大幅提高权重！
      PathDist.scale: 64.0  # 原 32.0 -> 改为 64.0 (拒绝偏离！)
      
      # GoalAlign: 降低它，防止为了看终点而切弯
      GoalAlign.scale: 16.0 # 原 24.0 -> 改为 16.0
      GoalAlign.forward_point_distance: 0.1
      
      # GoalDist: 接近终点的诱惑，稍微降一点防止最后冲太猛
      GoalDist.scale: 20.0  # 原 24.0 -> 改为 20.0
      
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 2.5
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 8.0
      global_frame: odom
      robot_base_frame: base_link # 正确
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.2 # 正确：保守半径
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 26.0
        inflation_radius: 0.1
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan # 【修改】绝对路径
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link # 正确
      use_sim_time: True
      robot_radius: 0.07 # 正确：保守半径
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan # 【修改】绝对路径
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 26.0
        inflation_radius: 0.1
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "/home/wei/final_proj_ros2/src/car_bot_urdf/map/indoor_map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

behavior_server:    # <--- 改成这个，必须和 Lifecycle Manager 里的名字一致
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # 注意：这里建议把 key 也改一下，虽然 humble 兼容旧名，但标准写法是 behavior_plugins
    behavior_plugins: ["spin", "backup", "wait"] 
    spin:
      plugin: "nav2_behaviors/Spin"   # 建议确认插件路径是否为 nav2_behaviors
    backup:
      plugin: "nav2_behaviors/BackUp" # 建议确认插件路径
    wait:
      plugin: "nav2_behaviors/Wait"   # 建议确认插件路径
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 8.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 8.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: True
    autostart: True
    bond_timeout: 60.0
    node_names: ['map_server', 'amcl']

# 2. 负责导航的管理器 (管剩下的)
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: True
    bond_timeout: 60.0
    node_names: ['controller_server',
                 'bt_navigator',
                 'planner_server',
                 'behavior_server',
                 'waypoint_follower']