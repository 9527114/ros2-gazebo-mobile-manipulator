slam_toolbox:
  ros__parameters:

    # ===== 基本模式 =====
    mode: mapping

    # ===== 坐标系 =====
    map_frame: map
    odom_frame: odom
    base_frame: base_link

    # ===== 传感器 =====
    scan_topic: scan
    max_laser_range: 10.0

    # ===== 更新频率 =====
    map_update_interval: 1.0

    # ===== 回环（可以先保守）=====
    do_loop_closing: true
    loop_closure_min_score: 0.2

    # ===== 仿真时间 =====
    use_sim_time: true
